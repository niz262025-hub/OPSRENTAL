name: OpsRental baseline migration validation
on:
  push:
    branches: [staging/production-baseline]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: local_ci_only
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated dependency fixtures
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon;
          CREATE ROLE authenticated;
          CREATE ROLE service_role BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users(id uuid PRIMARY KEY);
          CREATE TABLE public.myops_organizations(id uuid PRIMARY KEY, owner_user_id uuid);
          CREATE TABLE public.myops_trials(id uuid PRIMARY KEY, user_id uuid, organization_id uuid, status text, policy_version integer, started_at timestamptz, expires_at timestamptz);
          CREATE SCHEMA storage;
          CREATE TABLE storage.buckets(id text PRIMARY KEY, public boolean, file_size_limit bigint);
          CREATE TABLE storage.objects(id uuid PRIMARY KEY, bucket_id text, name text);
          ALTER TABLE storage.objects ENABLE ROW LEVEL SECURITY;
          INSERT INTO storage.buckets VALUES ('opsrental-private',false,3145728);
          SQL
      - name: Replay staging migrations
        run: |
          for f in supabase/migrations/20261126*.sql; do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Verify restricted schema
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE t text;
          BEGIN
            FOREACH t IN ARRAY ARRAY['rental_properties','rental_leases','rental_payments','rental_tickets','rental_documents','myops_rental_trial_operations'] LOOP
              IF NOT EXISTS (SELECT 1 FROM pg_class WHERE oid=('public.'||t)::regclass AND relrowsecurity) THEN RAISE EXCEPTION 'RLS missing: %',t; END IF;
              IF has_table_privilege('anon','public.'||t,'SELECT,INSERT,UPDATE,DELETE') OR has_table_privilege('authenticated','public.'||t,'SELECT,INSERT,UPDATE,DELETE') THEN RAISE EXCEPTION 'Browser privilege: %',t; END IF;
            END LOOP;
            IF NOT EXISTS (SELECT 1 FROM pg_policies WHERE schemaname='storage' AND policyname='opsrental_private_deny_guard' AND permissive='RESTRICTIVE') THEN RAISE EXCEPTION 'Storage guard missing'; END IF;
          END $$;
          SQL
