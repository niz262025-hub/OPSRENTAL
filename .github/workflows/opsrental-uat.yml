name: OpsRental automated UAT
on:
  push:
    branches:
      - fix/opsrental-production-readiness-20261118
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - run: npm run check
      - run: node --check rental-api.js
      - run: npm test
  private-storage-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SUPABASE_EXPERIMENTAL_STACK: '1'
      SUPABASE_TELEMETRY_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start disposable local Supabase and run storage UAT
        shell: bash
        run: |
          set -euo pipefail
          unset SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD || true
          export SUPABASE_HOME="$RUNNER_TEMP/supabase-home"
          test_dir="$RUNNER_TEMP/opsrental-storage-uat"
          mkdir -p "$test_dir"
          npm install --prefix "$test_dir" --no-save supabase@3.2.0 >/dev/null
          cli="$test_dir/node_modules/.bin/supabase"
          cd "$test_dir"
          "$cli" init >/dev/null
          cleanup() { "$cli" stop >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          "$cli" start --runtime native --preparation on-demand --exclude realtime,functions,studio,mail,analytics,pooler > "$RUNNER_TEMP/supabase-start.log" 2>&1 || { echo 'Local Supabase failed to start; inspect runner service connectivity.'; exit 1; }
          "$cli" status --env --output-format text > "$RUNNER_TEMP/supabase-local.env"
          set -a
          source "$RUNNER_TEMP/supabase-local.env"
          set +a
          case "${API_URL:-}" in http://127.0.0.1:*|http://localhost:*) ;; *) echo 'Refusing non-loopback API'; exit 1;; esac
          test -n "${SERVICE_ROLE_KEY:-}"
          node -e 'const u=new URL(process.env.DB_URL); if (!["localhost","127.0.0.1"].includes(u.hostname)) process.exit(1)'
          psql "$DB_URL" -v ON_ERROR_STOP=1 --file "$GITHUB_WORKSPACE/tests/storage-uat/fixture.sql" >/dev/null
          cd "$GITHUB_WORKSPACE"
          node --test tests/storage-uat/real-storage.test.mjs

  hosted-preview-probe:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'labeled' &&
      github.event.label.name == 'staging-preview-probe-approved.' &&
      github.actor == github.repository_owner && github.event.pull_request.number == 5 &&
      github.event.pull_request.head.repo.id == github.event.repository.id &&
      github.event.pull_request.head.ref == 'fix/rental-central-return-navigation'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Verify protected Preview and signed-out application denial
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          class RefuseRedirects(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          secret = os.environ.get("VERCEL_AUTOMATION_BYPASS_SECRET")
          print("Actions secret available to this workflow:", bool(secret))
          if not secret:
              raise SystemExit("Staging automation secret is unavailable.")

          url = "https://opsrental-staging-gc83iz4vf-mohd-syaiful-nizam1.vercel.app/api/rental/documents"
          request = Request(url, headers={
              "Accept": "application/json",
              "x-vercel-protection-bypass": secret,
          })
          try:
              response = build_opener(RefuseRedirects).open(request, timeout=20)
          except HTTPError as error:
              response = error
          except (URLError, TimeoutError):
              raise SystemExit("OpsRental Preview request failed before an HTTP response.") from None

          with response:
              status = response.code
              try:
                  body = json.loads(response.read(8192))
              except (ValueError, UnicodeError):
                  body = None

          app_denied = status == 401 and body == {"error": "MYOPS session required"}
          print(f"OpsRental documents HTTP {status}; application session denial verified: {app_denied}")
          if not app_denied:
              raise SystemExit("Expected authenticated Vercel access and an application-level session denial.")
          PY
